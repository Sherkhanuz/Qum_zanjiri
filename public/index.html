<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="/qz.css">
</head>
<body>
<title>Qum zanjiri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header (date + tabs), one working column, the supply chain drawn as a station line. */
:root{
  --bg:#EDF0F1; --surface:#FFFFFF; --surface-2:#F5F7F8; --line:#D3DADD; --fg:#16222A; --muted:#566670;
  --accent:#0F5E7A; --accent-fg:#FFFFFF; --accent-soft:#DAEAF0; --rail:#2B3A42;
  --ok:#1B6E45; --ok-soft:#DCEFE4; --warn:#7A5200; --warn-soft:#FAEBC6; --bad:#A8231C; --bad-soft:#F8DDDA;
  --iso-fl:#DCEBF2; --iso-on:#C7E2EE; --iso-rd:#E9F1F5; --iso-bt:#86C5DD; --iso-bl:#2E86AB; --iso-br:#1F6C8E; --iso-st:#F2DCA6; --iso-sl:#DDB96F; --iso-sr:#C89D4F;
  --iso-wt:#FFFFFF; --iso-wl:#E2E9ED; --iso-wr:#C9D4DA; --iso-dt:#4A6270; --iso-dl:#2B3A42; --iso-dr:#22303A; --mark:#E4572E; --mark-fg:#FFFFFF;
  --f-head:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --series:#0A7EA8; --shade:rgba(22,34,42,.10);
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10171B; --surface:#182228; --surface-2:#1E2A31; --line:#2D3B44; --fg:#E5ECEF; --muted:#97A7B0;
  --accent:#5CB8D6; --accent-fg:#08171D; --accent-soft:#16313C; --rail:#C7D2D7;
  --ok:#6FCF97; --ok-soft:#153224; --warn:#F0BE60; --warn-soft:#3A2D11; --bad:#FF8E84; --bad-soft:#401F1C;
  --iso-fl:#1D2D37; --iso-on:#254454; --iso-rd:#17232B; --iso-bt:#5FB4D2; --iso-bl:#2A7797; --iso-br:#1D5C77; --iso-st:#DCC283; --iso-sl:#B99450; --iso-sr:#9A783A;
  --iso-wt:#DDE5E9; --iso-wl:#B3C0C7; --iso-wr:#94A3AB; --iso-dt:#5A7482; --iso-dl:#3C4F5A; --iso-dr:#0E1519; --mark:#FF7A52; --mark-fg:#1A0C07;
  --series:#2B9AC4; --shade:rgba(0,0,0,.45);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10171B; --surface:#182228; --surface-2:#1E2A31; --line:#2D3B44; --fg:#E5ECEF; --muted:#97A7B0;
  --accent:#5CB8D6; --accent-fg:#08171D; --accent-soft:#16313C; --rail:#C7D2D7;
  --ok:#6FCF97; --ok-soft:#153224; --warn:#F0BE60; --warn-soft:#3A2D11; --bad:#FF8E84; --bad-soft:#401F1C;
  --iso-fl:#1D2D37; --iso-on:#254454; --iso-rd:#17232B; --iso-bt:#5FB4D2; --iso-bl:#2A7797; --iso-br:#1D5C77; --iso-st:#DCC283; --iso-sl:#B99450; --iso-sr:#9A783A;
  --iso-wt:#DDE5E9; --iso-wl:#B3C0C7; --iso-wr:#94A3AB; --iso-dt:#5A7482; --iso-dl:#3C4F5A; --iso-dr:#0E1519; --mark:#FF7A52; --mark-fg:#1A0C07;
  --series:#2B9AC4; --shade:rgba(0,0,0,.45);
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:22px} h2{font-size:19px} h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px 0}
.topbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand small{color:var(--muted)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.bad{background:var(--warn-soft);color:var(--warn);border-color:transparent}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:thin}
nav.tabs a{flex:none;padding:8px 12px;font-family:var(--f-head);font-weight:600;font-size:15px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:22px;padding-top:18px}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sechead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.note{font-size:13px;color:var(--muted);max-width:75ch}
.banner{padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}

/* chain line */
.chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.node{position:relative;padding:34px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;border-right:1px solid var(--line)}
.node:last-child{border-right:0}
.node::before{content:"";position:absolute;left:0;right:0;top:17px;height:3px;background:var(--rail);opacity:.55}
.node:first-child::before{left:22px} .node:last-child::before{right:calc(100% - 22px)}
.node::after{content:"";position:absolute;left:14px;top:10px;width:17px;height:17px;border-radius:50%;background:var(--surface);border:3px solid var(--rail)}
.node.end::after{background:var(--accent);border-color:var(--accent)}
.node .nm{font-family:var(--f-head);font-weight:600;font-size:17px;display:flex;gap:6px;align-items:baseline}
.node .nm small{font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted)}
.node .big{font-family:var(--f-head);font-weight:700;font-size:28px;line-height:1.05}
.node .big small{font-size:14px;font-weight:500;color:var(--muted)}
.node dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12.5px}
.node dt{color:var(--muted)} .node dd{margin:0;text-align:right}
.node.neg .big{color:var(--bad)}
@media (max-width:560px){ .chain{grid-template-columns:1fr} .node{border-right:0;border-bottom:1px solid var(--line);padding:14px 14px 14px 44px}
  .node:last-child{border-bottom:0} .node::before{left:21px;right:auto;top:0;bottom:0;width:3px;height:auto}
  .node:first-child::before{left:21px;top:22px} .node:last-child::before{right:auto;bottom:calc(100% - 22px)} .node::after{left:14px;top:14px} }

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface-2);position:sticky;top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.w{white-space:normal;min-width:16ch}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:600;background:var(--surface-2)}
tr.sub td{color:var(--muted)}
.chip{display:inline-flex;gap:4px;align-items:center;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.na{background:var(--surface-2);color:var(--muted)}
.chip.demo{background:var(--accent-soft);color:var(--accent)}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.alerts li{display:flex;gap:10px;align-items:baseline;padding:8px 14px;border-bottom:1px solid var(--line)}
.alerts li:last-child{border-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-head);font-size:24px;font-weight:700;line-height:1.1}
.tile span{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px}

/* forms */
form.entry{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.fld small{font-size:11px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 8px;min-width:0;width:100%}
input.err,select.err{border-color:var(--bad)}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:180px;white-space:pre}
.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-weight:600;padding:7px 14px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.danger{color:var(--bad)}
button.link{border:0;background:none;padding:2px 4px;color:var(--accent);font-weight:500}
button.link.danger{color:var(--bad)}
.bars.one{height:8px;min-width:110px} .bars.one .bf{top:1px}
.mapfig{margin:0;display:flex;flex-direction:column;gap:8px}
.mapwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.mapwrap svg{display:block;width:100%;min-width:980px;height:auto}
.mapwrap .fl{fill:var(--iso-fl)} .mapwrap .rd{fill:var(--iso-rd)}
.mapwrap .bt{fill:var(--iso-bt)} .mapwrap .bl{fill:var(--iso-bl)} .mapwrap .br{fill:var(--iso-br)}
.mapwrap .st{fill:var(--iso-st)} .mapwrap .sl{fill:var(--iso-sl)} .mapwrap .sr{fill:var(--iso-sr)}
.mapwrap .wt{fill:var(--iso-wt)} .mapwrap .wl{fill:var(--iso-wl)} .mapwrap .wr{fill:var(--iso-wr)}
.mapwrap .dt{fill:var(--iso-dt)} .mapwrap .dl{fill:var(--iso-dl)} .mapwrap .dr{fill:var(--iso-dr)} .mapwrap .dk{fill:var(--iso-dr)}
.mapwrap .ar{fill:var(--iso-wt);opacity:.9}
.mapwrap .rail{stroke:var(--iso-dl);stroke-width:2.2} .mapwrap .tie{stroke:var(--iso-dt);stroke-width:3;opacity:.55}
.mapwrap .dash{stroke:var(--iso-bl);stroke-width:5;stroke-dasharray:3 9;stroke-linecap:round;opacity:.6}
.mapwrap .arm{stroke:var(--iso-dl);stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}
.mapwrap .ld{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3} .mapwrap .ldp{fill:var(--muted)}
.mapwrap .co{fill:var(--surface);stroke:var(--line);stroke-width:1}
.mapwrap .mk{fill:var(--mark)} .mapwrap .mkt{fill:var(--mark-fg);font:700 12.5px var(--f-head)}
.mapwrap .ct{fill:var(--fg);font:600 13.5px var(--f-head)} .mapwrap .cl{fill:var(--muted);font:400 11.5px var(--f-body);font-variant-numeric:tabular-nums}
.mapwrap .zn{cursor:pointer;outline:none}
.mapwrap .smk{fill:var(--iso-wr);opacity:0;transform-box:fill-box;transform-origin:center;animation:smk 4.2s linear infinite}
.mapwrap .mv{animation-name:mv;animation-timing-function:linear;animation-iteration-count:infinite}
.mapwrap .shut{animation-name:shut;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.mapwrap .dig{animation:dig 3.4s ease-in-out infinite}
.mapwrap .dash.run{animation:dsh 1.1s linear infinite}
.mapwrap .idle{opacity:.45}
@keyframes mv{0%{transform:translate(0,0);opacity:0}7%{opacity:1}91%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes shut{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
@keyframes dig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes dsh{to{stroke-dashoffset:-12}}
@keyframes smk{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.6}100%{transform:translate(16px,-52px) scale(1.9);opacity:0}}
.mapwrap.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){ .mapwrap *{animation:none!important} .mapwrap .smk{opacity:.35} }
.mapwrap .zn.cal:hover .co,.mapwrap .zn.cal:focus-visible .co{stroke:var(--accent);stroke-width:2}
.mapwrap .zn.on .co{stroke:var(--mark);stroke-width:2.5} .mapwrap .zn.on .fl{fill:var(--iso-on)} .mapwrap .zn.on .cl{fill:var(--fg)}
.mkh{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--mark);color:var(--mark-fg);font-size:15px;vertical-align:2px}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;gap:12px}
.detail h3{margin-top:6px} .detail .tile{background:var(--surface-2)}
.bars{position:relative;height:16px;min-width:130px;background:var(--surface-2);border-radius:3px}
.bars i{position:absolute;left:0;height:6px;border-radius:3px}
.bars .bn{top:1px;background:var(--muted);opacity:.45}
.bars .bf{top:9px;background:var(--accent)}
.bars .bf.over{background:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-radius:0;font-weight:500;padding:5px 10px;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.msg{font-size:13px} .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.empty{padding:22px 14px;color:var(--muted);text-align:center}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
td input{padding:4px 6px;width:11ch;text-align:right} td input.txt{width:20ch;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:9;max-width:90vw}
@media (prefers-reduced-motion:no-preference){ .toast{transition:opacity .2s} }

/* --- v9: filtr paneli, jadval osti, raqam maydonlari, grafik, bo'limlar guruhi --- */
.datectl{display:inline-flex;align-items:center;gap:4px}
.datectl button{padding:6px 10px;font-weight:500;line-height:1.2}
nav.tabs .tsep{flex:none;width:1px;margin:9px 7px;background:var(--line)}
nav.tabs a:hover{color:var(--fg)}
tbody tr:not(.total):hover td{background:var(--surface-2)}
tr.total td{border-top:1px solid var(--line)}
.tblock{display:flex;flex-direction:column;gap:4px;min-width:0}
.tbar{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;font-size:12.5px;padding-inline:2px}
.tbar .tpage,.tbar .texp{display:inline-flex;gap:8px;align-items:center}
.tbar .texp{margin-left:auto}
.tbar button.link{font-size:12.5px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.fbar select,.fbar input[type=date],.fbar input[type=search]{width:auto;max-width:100%;padding:5px 8px}
.fbar input[type=search]{flex:1 1 190px;min-width:150px}
.frange{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.chk input{width:auto}
input.numin{text-align:right;font-variant-numeric:tabular-nums}
td.w2{white-space:normal;min-width:36ch}
nav.tabs a{padding:8px 10px;font-size:14.5px}
input::placeholder{color:var(--muted);opacity:.6}
input:hover,select:hover{border-color:var(--muted)}
button:hover:not(:disabled){border-color:var(--muted)} button.pri:hover:not(:disabled){filter:brightness(1.08)} button.link:hover:not(:disabled){text-decoration:underline}
.chartfig{margin:0;display:flex;flex-direction:column;gap:8px}
.chartwrap{position:relative;overflow-x:auto}
.chart{display:block;width:100%;min-width:620px;height:auto;outline:none}
.chart:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chart .cg{stroke:var(--line);stroke-width:1} .chart .cn{stroke:var(--muted);stroke-width:1} .chart .ch{stroke:var(--muted);stroke-width:1}
.chart .ca{fill:var(--muted);font:400 12px var(--f-body);font-variant-numeric:tabular-nums}
.chart .cv{fill:var(--fg);font:600 13px var(--f-body);font-variant-numeric:tabular-nums}
.chart .cl2{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .cw{fill:var(--series);opacity:.1} .chart .cd{fill:var(--series);stroke:var(--surface);stroke-width:2}
.ctip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 9px;display:flex;flex-direction:column;gap:1px;font-size:12.5px;width:168px;box-shadow:0 2px 10px var(--shade)}
.ctip b{font-size:14px} .ctip span{color:var(--muted)}
@media (max-width:560px){ .fbar select{flex:1 1 140px} .datectl #d-today{display:none} }

/* Kiritish: operator panellari */
.opday{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.opday b{font-family:var(--f-head);font-size:22px}
.opgh{margin:14px 0 6px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.opgrid.big{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.opcard{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;padding:12px 14px;min-height:96px;font-weight:400;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);white-space:normal}
.opcard b{font-family:var(--f-head);font-size:17px;font-weight:600;line-height:1.2}
.opcard>span:not(.chip){font-size:12.5px;color:var(--muted);line-height:1.35}
.opcard .chip{margin-top:auto}
.opcard:hover{border-color:var(--accent)}
.opcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opgrid.big .opcard{min-height:112px} .opgrid.big .opcard b{font-size:22px}
.opform{scroll-margin-top:130px}
.opinfo{padding:8px 12px;background:var(--surface-2);border-radius:var(--r);margin-bottom:8px}
form.entry.op{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px 16px;border-color:var(--accent)}
form.entry.op .fld label{font-size:13.5px;color:var(--fg);font-weight:600}
form.entry.op input,form.entry.op select{padding:10px;font-size:16px}
.fld.wide{grid-column:span 2}
.calc{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted);margin-top:2px}
form.entry .calc input{width:5.5em;padding:6px 8px;font-size:14px;flex:0 0 auto}
button.sm{padding:5px 10px;font-size:13px}
.opacts{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
nav.tabs button.link{margin-left:auto;white-space:nowrap}
@media (max-width:520px){ .fld.wide{grid-column:auto} }

/* ---- Mening uchastkam (operator hisobot paneli) ---- */
.my-filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0 2px}
.my-filters input[type=date]{width:auto}
button.my-tg{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:5px 12px;font-weight:500}
button.my-tg[aria-pressed="true"]{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.my-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.my-tile{position:relative;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.my-tile.ok{border-left-color:var(--ok)} .my-tile.warn{border-left-color:var(--warn)} .my-tile.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.my-tile .my-l{font-size:12.5px;color:var(--muted);font-weight:500}
.my-tile b{font-family:var(--f-head);font-size:26px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.my-tile.bad b{color:var(--bad)}
.my-tile .my-s{font-size:12.5px;color:var(--muted);line-height:1.35}
.my-prog{height:6px;background:var(--surface-2);border-radius:3px;margin-top:8px;overflow:hidden}
.my-prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.my-flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.my-step{flex:1 1 170px;min-width:160px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.my-step.ok{border-top-color:var(--ok)} .my-step.warn{border-top-color:var(--warn)} .my-step.bad{border-top-color:var(--bad)}
.my-step b{font-size:13px}
.my-step .my-v{font-size:13px;color:var(--muted)}
.my-step .my-r{font-family:var(--f-head);font-size:26px;font-weight:700;line-height:1.1}
.my-step.bad .my-r{color:var(--bad)}
.my-step .bars{min-width:0;width:100%}
.my-arr{align-self:center;color:var(--muted);font-size:20px}
.my-pos{color:var(--bad);font-weight:600} .my-neg{color:var(--ok);font-weight:600}
.my-eff{display:flex;flex-direction:column;gap:6px}
.my-er{display:grid;grid-template-columns:minmax(110px,1.3fr) 2fr auto auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:4px 2px;border-radius:4px}
.my-er:hover{background:var(--surface-2)}
.my-er .nm{display:flex;flex-direction:column;font-weight:600;min-width:0;overflow-wrap:anywhere}
.my-er .nm small{font-weight:400;color:var(--muted);font-size:12px}
.my-er .bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.my-er .bar i{display:block;height:100%;background:var(--bad);border-radius:5px}
.my-chart{overflow-x:auto}
.my-chart svg{display:block;min-width:340px;height:auto}
.my-grid{stroke:var(--line);stroke-width:1}
.my-ax{fill:var(--muted);font-size:12px}
.my-b.c1{fill:var(--accent)} .my-b.c2{fill:var(--warn)} .my-b.c3{fill:var(--ok)}
.my-ln{stroke:var(--accent);stroke-width:2;fill:none}
.my-norm{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.my-dot{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.my-dot.over{fill:var(--bad)}
.my-leg{display:inline-flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.my-leg .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.my-leg .sw.c1{background:var(--accent)} .my-leg .sw.c2{background:var(--warn)} .my-leg .sw.c3{background:var(--ok)}
.my-leg .sw.ln{background:var(--accent);height:3px;vertical-align:3px} .my-leg .sw.nm{background:var(--muted);height:3px;vertical-align:3px}
@media (max-width:560px){ .my-tile b,.my-step .my-r{font-size:22px} .my-er{grid-template-columns:1fr auto} .my-er .bar{grid-column:1/-1;order:3} }
</style>

      </div>

</div>
