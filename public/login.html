<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Qum zanjiri — kirish</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/page.css">
</head>
<body>
<main class="page narrow">
  <div class="brand"><h1>Qum zanjiri</h1><small>Karyerdan Megaton zavodigacha</small></div>
  <form class="card" id="f" novalidate>
    <div class="fld"><label for="login">Login</label><input id="login" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="fld"><label for="pw">Parol</label><input id="pw" name="password" type="password" autocomplete="current-password" required></div>
    <div class="msg" id="m" hidden role="alert"></div>
    <div class="actions"><button class="pri" id="go" type="submit">Kirish</button></div>
  </form>
  <p class="note" id="hint">Login va parolni administrator beradi. Parolni unutsangiz — administratorga murojaat qiling.</p>
  <p class="note" id="setup" hidden>Tizim hali sozlanmagan. <a href="/setup.html">Birinchi sozlashni boshlash →</a></p>
</main>
<script src="/page.js"></script>
<script src="/login.js"></script>
</body>
</html>
